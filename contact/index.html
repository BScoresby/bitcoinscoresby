<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/svg+xml" href="/assets/whale.svg">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/contact/contact.css">
  <link rel="stylesheet" href="/contact-v2/contact-v2.css">
  <meta name="description" content="Send BitcoinScoresby an encrypted message for 21 sats.">
  <title>Contact — BitcoinScoresby</title>
</head>
<body>
<main class="page">
  <header class="site-header">
    <a class="site-logo" href="/" aria-label="BitcoinScoresby home"><img src="/assets/whale.svg" alt=""><span class="site-name">BS</span></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="/whitepaper" aria-label="Whitepaper"><img src="/assets/paper.svg" alt=""></a>
      <a href="/archive" aria-label="Archive"><img src="/assets/folder.svg" alt=""></a>
      <a href="https://stacker.news" aria-label="Stacker News"><img src="/assets/lightning.svg" alt=""></a>
    </nav>
  </header>
  <h1>Contact</h1>
  <p class="intro">Send an encrypted message to Scoresby for 21 sats. Include a return address (email, Nostr, X, etc.) only if you want a reply.</p>
  <form id="contact-form" novalidate>
    <div class="terminal-message" id="terminal-message">
      <label for="message" class="terminal-prompt">&gt;</label>
      <textarea id="message" rows="6" maxlength="2000" aria-required="true" aria-label="Your message" autocomplete="off" spellcheck="false"></textarea>
      <span class="terminal-block" aria-hidden="true"></span>
    </div>
    <div class="terminal-reply">
      <label for="reply" class="terminal-reply-prompt">&gt; return address:</label>
      <span class="terminal-reply-input" id="terminal-reply-input">
        <input id="reply" maxlength="200" autocomplete="off" aria-label="Optional return address" spellcheck="false">
        <span class="terminal-reply-block" aria-hidden="true"></span>
      </span>
    </div>
    <div class="contact-actions"><button type="submit" id="create-invoice">Request postage · 21 sats</button></div>
  </form>

  <section id="payment-area" hidden aria-label="Payment">
    <div id="invoice-qr" aria-label="Lightning invoice QR code"></div>
    <details id="invoice-details">
      <summary>&gt; BOLT11 invoice</summary>
      <textarea id="invoice" rows="3" readonly spellcheck="false" aria-label="BOLT11 invoice"></textarea>
    </details>
    <div class="payment-actions">
      <button type="button" id="copy-invoice">Copy</button>
      <button type="button" id="abandon-attempt" hidden>Cancel</button>
    </div>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
  <section id="contact-success" hidden role="status">
    <h2>Message sent 📨⚡</h2>
    <button type="button" id="new-message">Write another message</button>
  </section>
</main>
<script type="module" src="/contact-v2/contact-v2.js"></script>
</body>
</html>
